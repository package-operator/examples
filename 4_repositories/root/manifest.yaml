apiVersion: manifests.package-operator.run/v1alpha1
kind: PackageManifest
metadata:
  name: root
spec:
  scopes:
  - Cluster
  - Namespaced
  phases:
  - name: deploy
  constraints:
  - platform:
    - OpenShift
  - platformVersion:
      name: OpenShift
      # range: '>=4.12,<4.13'
      range: '~4.13'
      # range: '~4.14' # 4.11.0 - 4.11.x
      # range: '~4.12' # 4.12.0 - 4.12.x
  dependencies:
  - image:
      name: pkg-a
      package: pkg-a.my-repo
      # range: '0-1'
  repositories:
  - file: repo.yaml
  # repository contains
  # - pkg-a@0.1.0 [OpenShift ~4.11]
  # - pkg-a@0.2.0 [OpenShift 4.12.x - 4.14.x && != 4.13.5]
  # - pkg-a@0.3.0 [OpenShift ~4.15]